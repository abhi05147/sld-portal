<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Change Password — APDCL Sub-Station Monitoring Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#f0f4fc;--surface:#fff;--border:#dde3ef;--text:#1a2744;--sub:#5a6a8a;--acc11:#0055cc;--acc33:#cc2200}
    [data-theme=dark]{--bg:#0f1623;--surface:#18212f;--border:#2a3a55;--text:#e0eaff;--sub:#8899bb}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(26,39,68,.14)}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
    .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#cc2200,#ff6644);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
    .logo-text .app-name{font-size:1.2rem;font-weight:700}
    .logo-text .app-sub{font-size:.78rem;color:var(--sub)}
    .alert{background:rgba(204,34,0,.08);border:1px solid rgba(204,34,0,.2);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:.88rem;color:var(--acc33);font-weight:600}
    h2{font-size:1.4rem;font-weight:700;margin-bottom:4px}
    .subtitle{font-size:.88rem;color:var(--sub);margin-bottom:24px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:.78rem;font-weight:700;color:var(--sub);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
    .input-wrap{position:relative}
    .input-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none}
    input[type=password]{width:100%;padding:11px 12px 11px 38px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:.95rem;outline:none;transition:border .2s,box-shadow .2s}
    input:focus{border-color:var(--acc11);box-shadow:0 0 0 3px rgba(0,85,204,.12)}
    .strength{height:4px;border-radius:2px;margin-top:6px;transition:width .3s,background .3s;width:0%}
    .btn{width:100%;padding:13px;background:var(--acc11);color:#fff;border:none;border-radius:9px;font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s,transform .15s}
    .btn:hover{background:#0044aa;transform:translateY(-1px)}
    .btn:disabled{background:#7799cc;cursor:not-allowed;transform:none}
    .error-msg{background:rgba(204,34,0,.09);border:1px solid rgba(204,34,0,.25);border-radius:8px;padding:10px 14px;color:var(--acc33);font-size:.88rem;font-weight:600;margin-bottom:16px;display:none}
    #toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999}
    .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--acc11);border-radius:8px;padding:12px 16px;min-width:240px;box-shadow:0 4px 20px rgba(0,0,0,.15);font-size:.88rem;font-weight:500;animation:slideIn .3s ease}
    .toast.success{border-left-color:#008c3c}
    @keyframes slideIn{from{transform:translateX(100%);opacity:0}}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">
      <div class="app-name">APDCL Sub-Station Monitoring Portal</div>
      <div class="app-sub">Password Security</div>
    </div>
  </div>

  <div class="alert" id="reset-notice" style="display:none">
    🔒 Your password has been reset by an administrator. You must set a new password before continuing.
  </div>

  <h2>Change Password</h2>
  <p class="subtitle">Choose a strong password with at least 8 characters</p>

  <div class="error-msg" id="error-msg"></div>

  <form id="pw-form">
    <div class="form-group" id="old-pw-group">
      <label>Current Password</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" id="old-password" placeholder="Enter current password"/>
      </div>
    </div>
    <div class="form-group">
      <label>New Password</label>
      <div class="input-wrap">
        <span class="icon">🔑</span>
        <input type="password" id="new-password" placeholder="Min 8 characters" oninput="checkStrength(this.value)"/>
      </div>
      <div class="strength" id="strength-bar"></div>
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <div class="input-wrap">
        <span class="icon">🔑</span>
        <input type="password" id="confirm-password" placeholder="Repeat new password"/>
      </div>
    </div>
    <button type="submit" class="btn" id="submit-btn">Update Password</button>
  </form>
</div>
<div id="toast-container"></div>

<script>
const isForced = new URLSearchParams(window.location.search).get('forced') === '1';
const user = (() => { try { return JSON.parse(localStorage.getItem('user') || 'null'); } catch { return null; } })();

if (!localStorage.getItem('access_token')) window.location.href = '/login';

if (isForced) {
  document.getElementById('reset-notice').style.display = 'block';
  document.getElementById('old-pw-group').style.display = 'none';
}

function checkStrength(pw) {
  const bar = document.getElementById('strength-bar');
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^a-zA-Z0-9]/.test(pw)) score++;
  const colors = ['#cc2200','#ff8800','#ddaa00','#008c3c'];
  bar.style.width = (score * 25) + '%';
  bar.style.background = colors[score-1] || '#eee';
}

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

document.getElementById('pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';
  const btn = document.getElementById('submit-btn');

  const oldPw  = document.getElementById('old-password').value;
  const newPw  = document.getElementById('new-password').value;
  const confPw = document.getElementById('confirm-password').value;

  if (newPw.length < 8) {
    errEl.textContent = 'New password must be at least 8 characters.';
    errEl.style.display = 'block'; return;
  }
  if (newPw !== confPw) {
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block'; return;
  }

  btn.disabled = true; btn.textContent = 'Updating…';

  const body = isForced
    ? { old_password: '__forced__', new_password: newPw, forced: true }
    : { old_password: oldPw, new_password: newPw };

  try {
    const res = await fetch('/api/v1/auth/change-password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('access_token'),
      },
      body: JSON.stringify(body),
    });
    const d = await res.json();
    if (!res.ok) {
      errEl.textContent = d.error || 'Failed to update password.';
      errEl.style.display = 'block';
    } else {
      toast('Password updated successfully!', 'success');
      // Update user in localStorage
      if (user) { user.password_reset_required = false; localStorage.setItem('user', JSON.stringify(user)); }
      setTimeout(() => window.location.href = '/dashboard', 1200);
    }
  } catch (err) {
    errEl.textContent = 'Network error. Please try again.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Update Password';
  }
});
</script>
</body>
</html>
