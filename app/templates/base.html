<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}GEC-II SLD Portal{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    /* ── CSS Variables ── */
    :root {
      --bg:        #f4f6fb;
      --surface:   #ffffff;
      --surface2:  #eef1f8;
      --border:    #dde3ef;
      --text:      #1a2744;
      --text-sub:  #5a6a8a;
      --accent33:  #cc2200;
      --accent11:  #0055cc;
      --accent-g:  #006600;
      --nav-bg:    #1a2744;
      --nav-text:  #c8d8f8;
      --nav-hi:    #ffffff;
      --stat-bg:   #ffffff;
      --shadow:    0 2px 12px rgba(26,39,68,.10);
      --radius:    10px;
    }
    [data-theme="dark"] {
      --bg:        #0f1623;
      --surface:   #18212f;
      --surface2:  #1f2d40;
      --border:    #2a3a55;
      --text:      #e0eaff;
      --text-sub:  #8899bb;
      --stat-bg:   #1a2744;
      --shadow:    0 2px 16px rgba(0,0,0,.4);
    }

    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background .3s, color .3s;
    }

    /* ── Navigation ── */
    nav {
      background: var(--nav-bg);
      display: flex; align-items: center; gap: 0;
      padding: 0 24px;
      height: 54px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .nav-brand {
      font-size: 1.15rem; font-weight: 700;
      color: var(--nav-hi); letter-spacing: .5px;
      text-decoration: none; margin-right: 32px;
      display: flex; align-items: center; gap: 10px;
    }
    .nav-brand .brand-logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #cc2200, #ff6644);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: white;
    }
    .nav-links { display: flex; gap: 2px; flex: 1; }
    .nav-links a {
      color: var(--nav-text); text-decoration: none;
      padding: 6px 14px; border-radius: 6px;
      font-size: .92rem; font-weight: 500; letter-spacing: .3px;
      transition: background .2s, color .2s;
    }
    .nav-links a:hover, .nav-links a.active {
      background: rgba(255,255,255,.12); color: var(--nav-hi);
    }
    .nav-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .theme-btn {
      background: rgba(255,255,255,.1); border: none;
      color: var(--nav-text); padding: 6px 10px; border-radius: 6px;
      cursor: pointer; font-size: 1rem; transition: background .2s;
    }
    .theme-btn:hover { background: rgba(255,255,255,.2); }
    .user-chip {
      background: rgba(255,255,255,.1);
      border-radius: 20px; padding: 4px 12px;
      font-size: .85rem; color: var(--nav-text);
      display: flex; align-items: center; gap: 6px;
    }
    .user-chip .role-badge {
      background: var(--accent11); color: white;
      font-size: .7rem; padding: 1px 6px; border-radius: 10px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    }
    .logout-btn {
      background: rgba(204,34,0,.3); border: 1px solid rgba(204,34,0,.5);
      color: #ff9988; padding: 5px 12px; border-radius: 6px;
      cursor: pointer; font-family: 'Rajdhani', sans-serif;
      font-size: .85rem; font-weight: 600; transition: background .2s;
    }
    .logout-btn:hover { background: rgba(204,34,0,.5); }

    /* ── Main Content ── */
    main { flex: 1; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; }

    /* ── Cards / Surfaces ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .card-header {
      font-size: 1rem; font-weight: 700; letter-spacing: .5px;
      color: var(--text); margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 2px solid var(--border); padding-bottom: 12px;
    }
    .card-header .dot33 { width: 10px; height: 10px; border-radius: 50%; background: var(--accent33); }
    .card-header .dot11 { width: 10px; height: 10px; border-radius: 50%; background: var(--accent11); }

    /* ── Stat Cards ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--stat-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      position: relative; overflow: hidden;
      transition: transform .2s, box-shadow .2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,39,68,.15); }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 4px; height: 100%; background: var(--accent-color, var(--accent11));
    }
    .stat-card .stat-label {
      font-size: .78rem; font-weight: 600; letter-spacing: .8px;
      text-transform: uppercase; color: var(--text-sub); margin-bottom: 8px;
    }
    .stat-card .stat-value {
      font-size: 2.2rem; font-weight: 700; color: var(--text);
      line-height: 1; font-variant-numeric: tabular-nums;
    }
    .stat-card .stat-unit {
      font-size: .8rem; color: var(--text-sub); margin-top: 4px; font-weight: 500;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 7px; border: none;
      font-family: 'Rajdhani', sans-serif; font-size: .9rem;
      font-weight: 600; cursor: pointer; letter-spacing: .3px;
      transition: all .2s; text-decoration: none;
    }
    .btn-primary { background: var(--accent11); color: white; }
    .btn-primary:hover { background: #0044aa; transform: translateY(-1px); }
    .btn-danger  { background: var(--accent33); color: white; }
    .btn-danger:hover  { background: #aa1800; }
    .btn-ghost {
      background: transparent; color: var(--text-sub);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .btn-sm { padding: 5px 12px; font-size: .82rem; }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th {
      background: var(--nav-bg); color: #c8d8f8;
      padding: 10px 12px; text-align: left;
      font-size: .76rem; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase;
    }
    th:first-child { border-radius: 6px 0 0 0; }
    th:last-child  { border-radius: 0 6px 0 0; }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: var(--surface2); }
    tr:last-child td { border-bottom: none; }

    /* ── Badges ── */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: .74rem; font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
    }
    .badge-33  { background: rgba(204,34,0,.12);  color: var(--accent33); }
    .badge-11  { background: rgba(0,85,204,.12);  color: var(--accent11); }
    .badge-ok  { background: rgba(0,140,60,.12);  color: #008c3c; }
    .badge-err { background: rgba(204,34,0,.12);  color: #cc2200; }
    .badge-warn{ background: rgba(180,120,0,.12); color: #b47800; }

    /* ── Inputs ── */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: .82rem; font-weight: 600;
      color: var(--text-sub); margin-bottom: 5px; letter-spacing: .3px;
    }
    input, select, textarea {
      width: 100%; padding: 9px 12px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text);
      font-family: 'Rajdhani', sans-serif; font-size: .92rem;
      outline: none; transition: border .2s, box-shadow .2s;
    }
    input:focus, select:focus {
      border-color: var(--accent11);
      box-shadow: 0 0 0 3px rgba(0,85,204,.12);
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 8px; z-index: 9999;
    }
    .toast {
      background: var(--surface); border: 1px solid var(--border);
      border-left: 4px solid var(--accent11);
      border-radius: 8px; padding: 12px 16px; min-width: 260px;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
      font-size: .88rem; font-weight: 500;
      animation: slideIn .3s ease;
    }
    .toast.error { border-left-color: var(--accent33); }
    .toast.success { border-left-color: #008c3c; }
    @keyframes slideIn { from { transform: translateX(100%); opacity:0; } to { transform: translateX(0); opacity:1; } }

    /* ── Loading ── */
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent11);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay {
      display: flex; align-items: center; justify-content: center;
      min-height: 200px; gap: 12px; color: var(--text-sub);
      font-size: .9rem; font-weight: 500;
    }

    /* ── Hierarchy Tree ── */
    .tree { font-size: .9rem; }
    .tree-gss {
      margin-bottom: 12px;
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .tree-gss-header {
      background: var(--nav-bg); color: #c8d8f8;
      padding: 10px 14px; font-weight: 700; font-size: .9rem;
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      user-select: none;
    }
    .tree-gss-header:hover { background: #223060; }
    .tree-ss {
      padding: 6px 14px 6px 28px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      transition: background .15s;
    }
    .tree-ss:hover { background: var(--surface2); }
    .tree-ss-name {
      color: var(--text); font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
    }
    .tree-ss-name:hover { color: var(--accent11); }
    .tree-feeders {
      padding: 4px 14px 8px 44px;
      display: none;
      border-bottom: 1px solid var(--border);
    }
    .tree-feeder {
      font-size: .82rem; color: var(--text-sub); padding: 2px 0;
      display: flex; align-items: center; gap: 6px;
    }
    .tree-feeder::before {
      content: '⤷'; color: var(--accent11); font-size: .9rem;
    }

    /* ── SLD Viewer ── */
    .sld-container {
      background: white; border: 1px solid var(--border);
      border-radius: var(--radius); overflow: auto;
      box-shadow: var(--shadow); min-height: 400px;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 20px;
    }
    [data-theme="dark"] .sld-container { background: #1a2233; }

    /* ── Map ── */
    #map { height: 340px; border-radius: 8px; overflow: hidden; }

    /* ── Upload Zone ── */
    .drop-zone {
      border: 2px dashed var(--border); border-radius: 12px;
      padding: 40px; text-align: center; cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent11); background: rgba(0,85,204,.05);
    }
    .drop-zone .drop-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .drop-zone .drop-label { font-size: .95rem; color: var(--text-sub); font-weight: 500; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      main { padding: 14px; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      nav { padding: 0 12px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <!-- Navigation (hidden on login page) -->
  {% block nav %}
  <nav id="main-nav" style="display:none">
    <a href="/dashboard" class="nav-brand">
      <div class="brand-logo">⚡</div>
      GEC-II SLD Portal
    </a>
    <div class="nav-links">
      <a href="/dashboard" id="nav-dashboard">Dashboard</a>
      <a href="#" id="nav-upload" style="display:none">Upload Data</a>
      <a href="#" id="nav-users" style="display:none">Users</a>
    </div>
    <div class="nav-right">
      <button class="theme-btn" id="theme-toggle" title="Toggle theme">🌙</button>
      <div class="user-chip">
        <span id="nav-username">—</span>
        <span class="role-badge" id="nav-role">viewer</span>
      </div>
      <button class="logout-btn" id="logout-btn">Sign Out</button>
    </div>
  </nav>
  {% endblock %}

  <main>{% block content %}{% endblock %}</main>

  <div id="toast-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  // ── Token helpers ──────────────────────────────────────────────────────────
  const Auth = {
    getAccess:  () => localStorage.getItem('access_token'),
    getRefresh: () => localStorage.getItem('refresh_token'),
    setTokens(a, r) { localStorage.setItem('access_token', a); if(r) localStorage.setItem('refresh_token', r); },
    clear() { localStorage.removeItem('access_token'); localStorage.removeItem('refresh_token'); localStorage.removeItem('user'); },
    getUser() { try { return JSON.parse(localStorage.getItem('user') || 'null'); } catch { return null; } },
    setUser(u) { localStorage.setItem('user', JSON.stringify(u)); },
    isLoggedIn() { return !!this.getAccess(); },
    redirect() { window.location.href = '/login'; },
  };

  async function apiFetch(url, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...opts.headers };
    if (Auth.getAccess()) headers['Authorization'] = 'Bearer ' + Auth.getAccess();
    let res = await fetch(url, { ...opts, headers });
    if (res.status === 401) {
      // Try refresh
      const rr = await fetch('/api/v1/auth/refresh', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + Auth.getRefresh() }
      });
      if (rr.ok) {
        const d = await rr.json();
        Auth.setTokens(d.access_token);
        headers['Authorization'] = 'Bearer ' + d.access_token;
        res = await fetch(url, { ...opts, headers });
      } else {
        Auth.clear(); Auth.redirect(); return null;
      }
    }
    return res;
  }

  // ── Toast ──────────────────────────────────────────────────────────────────
  function toast(msg, type = 'info', dur = 4000) {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), dur);
  }

  // ── Theme ──────────────────────────────────────────────────────────────────
  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('theme-toggle')?.addEventListener('click', () => {
    const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('theme', t);
    document.getElementById('theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
  });
  if (savedTheme === 'dark') {
    const tb = document.getElementById('theme-toggle');
    if (tb) tb.textContent = '☀️';
  }

  // ── Nav init ──────────────────────────────────────────────────────────────
  (function initNav() {
    const user = Auth.getUser();
    const nav = document.getElementById('main-nav');
    const path = window.location.pathname;
    if (!nav) return;
    if (path === '/login' || path === '/') return;
    if (!Auth.isLoggedIn()) { Auth.redirect(); return; }
    nav.style.display = 'flex';
    if (user) {
      document.getElementById('nav-username').textContent = user.username || '—';
      document.getElementById('nav-role').textContent = user.role || 'viewer';
      if (['admin','engineer'].includes(user.role)) {
        document.getElementById('nav-upload').style.display = '';
        document.getElementById('nav-upload').href = '/admin/upload';
      }
      if (user.role === 'admin') {
        document.getElementById('nav-users').style.display = '';
        document.getElementById('nav-users').href = '/admin/users';
      }
    }
    // Active link
    document.querySelectorAll('.nav-links a').forEach(a => {
      if (a.href && window.location.pathname.startsWith(new URL(a.href, location).pathname)) {
        a.classList.add('active');
      }
    });
    document.getElementById('logout-btn')?.addEventListener('click', () => {
      Auth.clear(); window.location.href = '/login';
    });
  })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
